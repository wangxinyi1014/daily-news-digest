name: 📰 Daily News Digest

on:
  # ⏰ 定时调度（GitHub 自带 cron，无需外部 cron-job.org）：
  #    北京时间 09:00 = UTC 01:00（每天早上推送一次）
  #    如需改时间，调整下面的 cron 即可（cron 使用 UTC 时区）。
  schedule:
    - cron: '0 1 * * *'

  # 也支持在 GitHub 网页上手动触发（Actions → Run workflow）
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（跳过去重检查）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一时段只允许一个 job 跑，防止多个 cron 同时触发导致重复推送
concurrency:
  group: digest-lock
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-22.04

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 语义去重的嵌入模型缓存：首次 run 下载 ~100MB，之后命中缓存近乎零成本。
      - name: 🧠 缓存嵌入模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-minilm-l12-v1

      - name: 🧪 运行单元测试（不过就不推送）
        run: python -m pytest test_core.py test_semantic_dedup.py test_critique.py test_triage.py -q

      - name: 📰 运行每日简报
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: 💾 提交推送记录（避免早晚报重复）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json digests/ sent_github_repos.json
          if git diff --cached --quiet; then
            echo "推送记录无变化，跳过提交"
          else
            git commit -m "更新推送记录 [skip ci]"
            # 先 rebase 拉取远端最新，避免与并发/手动触发的提交撞成 non-fast-forward
            git pull --rebase --autostash
            git push
          fi
